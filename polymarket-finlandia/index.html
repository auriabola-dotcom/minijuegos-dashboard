<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Polymarket en Finlandia</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #eef0ec; --surface: #fbfcfa; --ink: #14171a; --muted: #5b626a; --line: #d3d8d0;
  --verde: #1f7a4d; --verde-soft: #d8efe2;
  --ambar: #9a6200; --ambar-soft: #fbefd0;
  --rojo: #b3261e; --rojo-soft: #f9dedc;
  --link: #2553c7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111416; --surface: #1a1e21; --ink: #e8ebe6; --muted: #9aa3ab; --line: #2c3236;
    --verde: #5fcf94; --verde-soft: #183427;
    --ambar: #f0b648; --ambar-soft: #3a2d12;
    --rojo: #f08a82; --rojo-soft: #3d1c1a;
    --link: #8fb0ff;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Instrument Sans", system-ui, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 16px; margin-bottom: 16px; }
h1 { font-size: 1.5rem; line-height: 1.2; margin: 0; letter-spacing: -.01em; }
.mono { font: 500 .8rem "IBM Plex Mono", monospace; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin-bottom: 14px; }
.hero { border-left: 6px solid var(--c); }
.hero .row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 10px; }
.pill { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: .9rem; padding: 5px 12px 5px 10px; border-radius: 999px; background: var(--c-soft); color: var(--c); }
.pill::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.tag { font-size: .82rem; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tag.nuevo { background: var(--rojo-soft); color: var(--rojo); border-color: transparent; }
.titular { font-size: 1.2rem; font-weight: 600; margin: 0; }
h2 { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
.ind { list-style: none; margin: 0; padding: 0; }
.ind li { display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 10px; align-items: start; padding: 10px 0; border-top: 1px solid var(--line); }
.ind li:first-child { border-top: 0; padding-top: 0; }
.ind .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--c); margin-top: 6px; }
.ind .t { font-weight: 600; }
.ind .v { font-weight: 600; color: var(--c); text-align: right; white-space: nowrap; }
.ind .d { grid-column: 2 / 4; color: var(--muted); font-size: .9rem; }
.st-ok { --c: var(--verde); --c-soft: var(--verde-soft); }
.st-ojo { --c: var(--ambar); --c-soft: var(--ambar-soft); }
.st-mal { --c: var(--rojo); --c-soft: var(--rojo-soft); }
.lv-verde { --c: var(--verde); --c-soft: var(--verde-soft); }
.lv-ambar { --c: var(--ambar); --c-soft: var(--ambar-soft); }
.lv-rojo  { --c: var(--rojo);  --c-soft: var(--rojo-soft); }
ul.plain { margin: 0; padding-left: 18px; }
ul.plain li { margin: 0 0 6px; }
.fechas { list-style: none; margin: 0; padding: 0; }
.fechas li { display: flex; gap: 12px; align-items: baseline; }
.fechas .n { font: 600 1.4rem "IBM Plex Mono", monospace; min-width: 4.5ch; }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: grid; grid-template-columns: 96px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.hist li:first-child { border-top: 0; padding-top: 0; }
.hist .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--c); }
details summary { cursor: pointer; font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
details ul { margin: 10px 0 0; padding-left: 18px; font-size: .9rem; }
a { color: var(--link); }
.nota { color: var(--muted); font-size: .8rem; margin-top: 8px; }
.err { color: var(--muted); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.cols .card { margin-bottom: 0; }
.cols + .card, .cols { margin-bottom: 14px; }
@media (max-width: 600px) { .cols { grid-template-columns: 1fr; } .hist li { grid-template-columns: 1fr; gap: 2px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Polymarket en Finlandia</h1>
    <span class="mono" id="rev"></span>
  </header>
  <div id="app" aria-live="polite"><p class="err">Cargando…</p></div>
  <p class="nota">Verde = todo bien · Ámbar = atención · Rojo = problema. Se revisa cada mañana. Informativo, no es asesoramiento legal ni fiscal.</p>
</main>
<script>
(async () => {
  const app = document.getElementById('app');
  const NIVEL = { verde: 'Verde', ambar: 'Ámbar', rojo: 'Rojo' };
  const ST = { ok: 'ok', ojo: 'ojo', mal: 'mal' };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const tz = { timeZone: 'Europe/Madrid' };
  const dia = iso => new Date(iso).toLocaleDateString('en-CA', tz);
  const dias = (a, b) => Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 864e5);
  try {
    const r = await fetch(`estado.json?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const e = await r.json();
    const lv = NIVEL[e.nivel] ? e.nivel : 'ambar';
    const rev = new Date(e.revisado);
    document.getElementById('rev').textContent = isNaN(rev) ? '' :
      'Revisado: ' + rev.toLocaleString('es-ES', { ...tz, day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    const hoy = dia(new Date());
    const hist = (e.historial || []).slice().sort((a, b) => a.fecha < b.fecha ? 1 : -1);
    const ultimo = hist[0]?.fecha;
    const nuevo = ultimo && !isNaN(rev) && ultimo === dia(rev) && hist.length > 1;
    const sinCambios = ultimo ? dias(ultimo, hoy) : null;
    const tag = nuevo ? '<span class="tag nuevo">Novedad hoy</span>'
      : sinCambios !== null ? `<span class="tag">${sinCambios === 0 ? 'Revisado hoy' : `${sinCambios} día${sinCambios === 1 ? '' : 's'} sin novedades`}</span>` : '';
    const ind = (e.indicadores || []).map(i => {
      const s = ST[i.estado] || 'ojo';
      return `<li class="st-${s}"><span class="dot"></span><span class="t">${esc(i.titulo)}</span><span class="v">${esc(i.valor)}</span><span class="d">${esc(i.detalle)}</span></li>`;
    }).join('');
    const fechas = (e.fechas || []).map(f => {
      const n = dias(hoy, f.fecha);
      return `<li><span class="n">${n >= 0 ? n : '—'}</span><span>días · <b>${esc(new Date(f.fecha + 'T12:00:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }))}</b><br><span class="mono" style="font-family:inherit;font-size:.9rem">${esc(f.texto)}</span></span></li>`;
    }).join('');
    app.innerHTML = `
      <section class="card hero lv-${lv}">
        <div class="row"><span class="pill">${esc(e.etiqueta || NIVEL[lv])}</span>${tag}</div>
        <p class="titular">${esc(e.titular)}</p>
      </section>
      <section class="card"><h2>Lo importante</h2><ul class="ind">${ind}</ul></section>
      <div class="cols">
        <section class="card"><h2>Si un día bloquean</h2><ul class="plain">${(e.si_bloquean || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>
        <section class="card"><h2>Próxima fecha clave</h2><ul class="fechas">${fechas}</ul>
          <h2 style="margin-top:16px">Qué vigilo</h2><ul class="plain">${(e.vigilar || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>
      </div>
      <section class="card"><h2>Cambios</h2><ul class="hist">${hist.map(h => {
        const hl = NIVEL[h.nivel] ? h.nivel : 'ambar';
        return `<li class="lv-${hl}"><span class="mono"><span class="dot"></span>${esc(h.fecha)}</span><span>${esc(h.cambio)}</span></li>`;
      }).join('')}</ul></section>
      <section class="card"><details><summary>Fuentes (${(e.fuentes || []).length})</summary><ul>${(e.fuentes || []).map(f => `<li><a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.titulo)}</a></li>`).join('')}</ul></details></section>`;
  } catch (err) {
    app.innerHTML = '<p class="err">No se pudo cargar el estado (estado.json). Prueba a recargar.</p>';
  }
})();
</script>
</body>
</html>
